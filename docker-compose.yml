services:
  kanban:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data/tasks:/app/data/tasks
    environment:
      - TASKS_DIR=/app/data/tasks
      - PUSH_SUBSCRIPTIONS_FILE=/app/data/tasks/.kanban/push-subscriptions.json
      - NODE_ENV=production
    restart: unless-stopped
